name: Windows build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  native:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: quota-orb-windows
          path: |
            artifacts/QuotaOrb.exe
            artifacts/QuotaOrb.exe.config
            artifacts/QuotaOrb.Launcher.exe
            LICENSE
